[project]
name = "repowiki-cli"
version = "0.1.0"
description = "CLI tool for querying DeepWiki documentation"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mcp>=1.0.0,<2.0.0", "typer>=0.12.0", "httpx>=0.27.0"]

[project.scripts]
repowiki-cli = "repowiki.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repowiki"]

[dependency-groups]
dev = ["pytest>=8.0.0", "pytest-asyncio>=0.23.0"]
